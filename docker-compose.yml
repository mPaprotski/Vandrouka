services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vandrouka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY in backend/.env}
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    volumes:
      - media_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/vandrouka?sslmode=disable
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      MAPBOX_URL: https://api.mapbox.com
      PLANNER_WALK_PENALTY: ${PLANNER_WALK_PENALTY:-0.5}
      PLANNER_COST_PENALTY: ${PLANNER_COST_PENALTY:-0.1}
      PLANNER_UNVERIFIED_PENALTY: ${PLANNER_UNVERIFIED_PENALTY:-0.5}
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-vandrouka-visit-photos}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY in backend/.env}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY in backend/.env}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-720h}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-24h}
      VISIT_RADIUS_M: ${VISIT_RADIUS_M:-50}
      VISIT_ACCURACY_M: ${VISIT_ACCURACY_M:-30}
      VISIT_MAX_AGE: ${VISIT_MAX_AGE:-120s}
      VISIT_FUTURE_SKEW: ${VISIT_FUTURE_SKEW:-30s}
      DATA_DIR: /app/data
      ROUTE_REQUESTS_PER_MINUTE: ${ROUTE_REQUESTS_PER_MINUTE:-6}
      ROUTE_BURST: ${ROUTE_BURST:-2}
      ROUTE_MAX_CONCURRENT: ${ROUTE_MAX_CONCURRENT:-2}
      ROUTE_MAX_CLIENTS: ${ROUTE_MAX_CLIENTS:-4096}
      ROUTE_CLIENT_TTL_SECONDS: ${ROUTE_CLIENT_TTL_SECONDS:-600}
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ${DATA_HOST_DIR:-../data}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
