services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vandrouka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/vandrouka?sslmode=disable
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      MAPBOX_URL: https://api.mapbox.com
      PLANNER_WALK_PENALTY: ${PLANNER_WALK_PENALTY:-0.5}
      PLANNER_COST_PENALTY: ${PLANNER_COST_PENALTY:-0.1}
      PLANNER_UNVERIFIED_PENALTY: ${PLANNER_UNVERIFIED_PENALTY:-0.5}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
