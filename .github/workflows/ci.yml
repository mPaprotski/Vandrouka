name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: Planner constraints without external services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test planner constraints and schedules
        run: go test ./internal/planner -race -count=1 -timeout 2m -coverprofile=planner-coverage.out -v

      - name: Build planner CLI
        run: go build -o "$RUNNER_TEMP/vandrouka-planner" ./cmd/planner

      - name: Check CLI rejects invalid budget before accessing services
        run: |
          if "$RUNNER_TEMP/vandrouka-planner" --budget 0 > "$RUNNER_TEMP/planner-error.txt" 2>&1; then
            echo "CLI accepted an invalid time budget"
            exit 1
          fi
          grep -F 'бюджет времени должен быть положительным' "$RUNNER_TEMP/planner-error.txt"

  backend:
    name: Go checks and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/vandrouka_ci?sslmode=disable
      TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/vandrouka_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vandrouka_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vandrouka_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build all commands
        run: go build ./...

      - name: Check migration round trip
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate reset
          go run ./cmd/migrate up

      - name: Run tests with PostgreSQL and race detector
        run: go test ./... -race -count=1 -timeout 2m -v

      - name: Check importer CLI and repeated import
        run: |
          go run ./cmd/import -check-links=false ../data/places/minsk
          go run ./cmd/import -check-links=false ../data/places/minsk

  docker:
    name: Build API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --profile routing config --quiet

      - name: Build API image
        run: docker build --tag vandrouka-api:ci ./backend
