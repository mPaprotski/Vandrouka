name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vandrouka
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Test
        run: cd backend && go test ./... -v
      - name: Vet
        run: cd backend && go vet ./...
      - name: Fmt check
        run: test -z "$(cd backend && gofmt -l .)"
      - name: Migration round trip
        env:
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/vandrouka?sslmode=disable
        run: |
          cd backend
          go run ./cmd/migrate up
          go run ./cmd/migrate reset
          go run ./cmd/migrate up
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/vandrouka?sslmode=disable
        run: cd backend && go test ./... -race -count=1
