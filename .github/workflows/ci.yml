name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: Planner and Mapbox checks without external services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test planner, Mapbox adapters and CLI
        run: go test ./internal/planner ./internal/plannercheck ./internal/routes ./internal/routing ./cmd/planner -race -count=1 -timeout 2m -coverprofile=planner-coverage.out -v

      - name: Run offline acceptance report
        run: go run ./cmd/planner-bench -output "$RUNNER_TEMP/planner-report.json"

      - name: Benchmark fixed planner scenarios
        run: go test ./internal/plannercheck -run '^$' -bench BenchmarkPlannerGolden -benchmem -benchtime=200ms

      - name: Build planner CLI
        run: go build -o "$RUNNER_TEMP/vandrouka-planner" ./cmd/planner

      - name: Check CLI rejects invalid budget before accessing services
        run: |
          if "$RUNNER_TEMP/vandrouka-planner" --budget 0 > "$RUNNER_TEMP/planner-error.txt" 2>&1; then
            echo "CLI accepted an invalid time budget"
            exit 1
          fi
          grep -F 'бюджет времени должен быть положительным' "$RUNNER_TEMP/planner-error.txt"

  backend:
    name: Go checks and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/vandrouka_ci?sslmode=disable
      TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/vandrouka_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vandrouka_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vandrouka_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build all commands
        run: go build ./...

      - name: Check migration round trip
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate reset
          go run ./cmd/migrate up

      - name: Run tests with PostgreSQL and race detector
        run: go test ./... -race -count=1 -timeout 2m -v

      - name: Check importer CLI and repeated import
        run: |
          go run ./cmd/import -check-links=false ../data/places/minsk
          psql "$POSTGRES_DSN" -Atc 'SELECT slug,id FROM places ORDER BY slug' > "$RUNNER_TEMP/places-before.txt"
          go run ./cmd/import -check-links=false ../data/places/minsk
          psql "$POSTGRES_DSN" -Atc 'SELECT slug,id FROM places ORDER BY slug' > "$RUNNER_TEMP/places-after.txt"
          diff -u "$RUNNER_TEMP/places-before.txt" "$RUNNER_TEMP/places-after.txt"
          expected=$(find ../data/places/minsk -name '*.yaml' | wc -l)
          actual=$(psql "$POSTGRES_DSN" -Atc 'SELECT count(*) FROM places WHERE is_active')
          test "$actual" -eq "$expected"

  catalog:
    name: Catalog source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Check GPX provenance and catalog mappings
        run: python3 scripts/check_catalog_sources.py

      - name: Install OpenAPI validators
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-venv"
          "$RUNNER_TEMP/openapi-venv/bin/pip" install -r scripts/requirements-openapi.txt

      - name: Validate API contract and examples
        run: '"$RUNNER_TEMP/openapi-venv/bin/python" scripts/check_openapi.py'

  docker:
    name: Build API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag vandrouka-api:ci ./backend
