        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/me/exploration:
    get:
      summary: Private lifetime discoveries, achievements and fixed thematic collection
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      description: 'One repeatable-read snapshot, scoped to the session owner. Awards
        at 1/5/10 unique first discoveries are persisted once, including backfill.
        Hidden visits/deleted photos do not revoke progress. No extra XP. Unavailable
        collection places stay in its fixed total. Cache-Control: no-store.'
      responses:
        '200':
          description: Lifetime exploration state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exploration'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token issued by register/login, valid for 24 hours
        by default (AUTH_ACCESS_TTL).
  headers:
    RequestID:
      description: Идентификатор, назначенный сервером для поиска запроса в журнале.
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  parameters:
    CitySlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  responses:
    RateLimited:
      description: Превышена частота запросов или число одновременно выполняемых расчётов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Число секунд до следующей попытки; не гарантирует наличие свободного
            слота.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            error:
              code: rate_limited
              message: Слишком много запросов маршрутизации; повторите позже
    Error:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Ошибка запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    ConstraintsViolation:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Обязательное добавление или исходный порядок несовместимы с временем,
        расписанием, достижимостью или бюджетом.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            error:
              code: constraints_violation
              message: Обязательное добавление или исходный порядок несовместимы с
                временем, расписанием, достижимостью или бюджетом.
    RoutingUnavailable:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Mapbox недоступен, превышена квота, отсутствует/отклонён серверный
        токен или истёк срок запроса. Токен и внутренние URL не возвращаются клиенту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            error:
              code: routing_unavailable
              message: Mapbox недоступен, превышена квота, отсутствует/отклонён серверный
                токен или истёк срок запроса. Токен и внутренние URL не возвращаются
                клиенту.
  schemas:
    PhotoQuest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 3000
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - city_id
      - title
      - description
      - status
      - revision
      - created_at
      - updated_at
    PhotoQuestEditor:
      allOf:
      - "$ref": "#/components/schemas/PhotoQuest"
      - type: object
        properties:
          steps:
            type: array
            items:
              "$ref": "#/components/schemas/PhotoQuestStep"
            maxItems: 20
        required:
        - steps
    PhotoQuestStep:
      type: object
      properties:
        place_id:
          type: integer
          format: int64
          minimum: 1
        clue:
          type: string
          maxLength: 1000
        photo_task:
          type: string
          maxLength: 1000
        reveal_text:
          type: string
          maxLength: 3000
      required:
      - place_id
    PhotoQuestRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        quest_revision:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 120
          minLength: 3
        status:
          type: string
          enum:
          - waiting
          - active
          - finished
        join_enabled:
          type: boolean
        total_steps:
          type: integer
          format: int64
          minimum: 2
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
      required:
      - id
      - quest_id
      - quest_revision
      - title
      - status
      - join_enabled
      - total_steps
      - created_at
      - started_at
    PhotoQuestInvite:
      allOf:
      - "$ref": "#/components/schemas/PhotoQuestRun"
      - type: object
        properties:
          join_code:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{8}$"
        required:
        - join_code
    PhotoQuestParticipation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
          minLength: 3
        status:
          type: string
          enum:
          - waiting
          - active
          - completed
          - closed
        completed_steps:
          type: integer
          format: int64
          minimum: 0
        total_steps:
          type: integer
          format: int64
          minimum: 2
        joined_at:
          type: string
          format: date-time
      required:
      - id
      - run_id
      - title
      - status
      - completed_steps
      - total_steps
      - joined_at
    PhotoQuestProgress:
      allOf:
      - "$ref": "#/components/schemas/PhotoQuestParticipation"
      - type: object
        properties:
          current_task:
            type: object
            properties:
              task_id:
                type: string
                format: uuid
              position:
                type: integer
                format: int64
                minimum: 1
              clue:
                type: string
                maxLength: 1000
                minLength: 1
              photo_task:
                type: string
                maxLength: 1000
                minLength: 1
            required:
            - task_id
            - position
            - clue
            - photo_task
          current_attempt:
            "$ref": "#/components/schemas/PhotoQuestAttempt"
          stories:
            type: array
            items:
              "$ref": "#/components/schemas/PhotoQuestStory"
            maxItems: 20
          xp_awarded:
            type: integer
            minimum: 0
          review_pending:
            type: boolean
          started_at:
            type: string
            format: date-time
          completed_at:
            type: string
            format: date-time
        required:
        - stories
        - xp_awarded
        - review_pending
    PhotoQuestAttempt:
      type: object
      required:
      - id
      - participation_id
      - task_id
      - position
      - status
      - revision
      - photo_ready
      - uploading
      - xp_awarded
      properties:
        id:
          type: string
          format: uuid
        participation_id:
          type: string
          format: uuid
        task_id:
          type: string
