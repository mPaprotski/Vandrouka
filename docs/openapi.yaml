  /v1/me/progress:
    get:
      summary: Read your lifetime XP and level
      x-implementation-status: implemented
      description: 'One reward-ledger snapshot scoped to the session owner; hiding
        visits or deleting photos does not revoke XP. Fixed level thresholds: 0/100/300/600/1000/1500/2100/2800/3600/4500.
        Level 10 keeps accumulating XP and has null next_level_xp/xp_to_next_level.
        Cache-Control: no-store. No owner parameter is accepted as a selector.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current server progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
              examples:
                new:
                  value:
                    total_xp: 0
                    level: 1
                    level_start_xp: 0
                    next_level_xp: 100
                    xp_to_next_level: 100
                level2:
                  value:
                    total_xp: 100
                    level: 2
                    level_start_xp: 100
                    next_level_xp: 300
                    xp_to_next_level: 200
                max:
                  value:
                    total_xp: 5000
                    level: 10
                    level_start_xp: 4500
                    next_level_xp: null
                    xp_to_next_level: null
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      summary: Rotate the refresh/access pair
      x-implementation-status: implemented
      description: 'Single-use refresh. Rotation revokes the old access. Replaying
        a consumed refresh revokes its entire family, including the newly returned
        pair; other device families stay active. Concurrent refresh must be serialized
        by the client. A lost successful refresh response requires sign-in again.
        Shared refresh/logout limit: 30 requests/minute per peer IP. Tokens accepted
        only in a JSON body, not URL/cookies.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshCredential'
            example:
              refresh_token: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '200':
          description: 'New token pair with the original absolute family deadline.
            Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                user:
                  id: 1
                  email: walker@example.com
                  created_at: '2026-10-21T09:00:00Z'
                access_token: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
                refresh_token: ddddddddddddddddddddddddddddddddddddddddddd
                token_type: Bearer
                expires_at: '2026-10-23T09:00:00Z'
                refresh_expires_at: '2026-11-20T09:00:00Z'
  /v1/auth/logout:
    post:
      summary: Revoke this device session family
      x-implementation-status: implemented
      description: 'The refresh credential selects a family even when access has expired.
        Revoke all access/refresh credentials in that family; other devices remain
        signed in. Repeated logout or an unknown well-formed credential returns 204.
        Shared refresh/logout limit: 30 requests/minute per peer IP. Tokens accepted
        only in a JSON body, not URL/cookies.'
      requestBody:
