      summary: Read the authenticated user
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      description: Rejects missing, malformed, unknown, expired or revoked sessions.
        Returns only the session owner. Does not accept tokens in query parameters
        or cookies.
      responses:
        '200':
          description: Current user
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - user
