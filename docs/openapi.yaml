openapi: 3.0.3
info:
  title: Вандроўка API
  version: 0.3.0
  description: Каталог, маршруты generate/recalculate, серверная авторизация и приватные фото «Вандроўкі».
    Register/login создают access-сессию; me возвращает её владельца. Refresh/logout
    и мобильный вход относятся к следующему этапу. Часы и цены неизвестных мест
    не считаются подтверждёнными.
servers:
- url: http://localhost:8080
paths:
  /v1/visits/photo-upload:
    post:
      summary: Upload a private visit photo
      x-implementation-status: implemented
      description: 'Authenticated multipart upload: exactly one place_id and file; no
        user_id. File up to 10 MiB, 20 million pixels and 8192 pixels per side. Actual
        JPEG/PNG must match declared MIME. Server applies EXIF orientation, re-encodes
        to remove metadata and returns only after a private object and ready metadata
        are saved. Two concurrent media operations per process, six upload attempts
        per minute per owner. Storage failures return 503 with durable cleanup of abandoned
        objects.'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - place_id
              - file
              properties:
                place_id:
                  type: integer
                  format: int64
                  minimum: 1
                file:
                  type: string
                  format: binary
                  description: One JPEG or PNG. Server validates actual format, removes
                    unnecessary metadata and stores a private object.
      responses:
        '201':
          description: Validated photo ready for confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPhoto'
              example:
                id: 00000000-0000-4000-8000-000000000001
                place_id: 7
                status: ready
                mime_type: image/jpeg
                size_bytes: 1024
                width: 800
                height: 600
                created_at: '2026-10-25T09:00:00Z'
                ready_at: '2026-10-25T09:00:02Z'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/visits/photos/{photo_id}:
    parameters:
    - name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Read your private visit photo
      x-implementation-status: implemented
      description: 'Only the session owner can read a ready, undeleted photo. Foreign,
        missing, malformed and deleted IDs return the same 404. Object length and SHA-256
        are checked before returning any bytes. No public URL; Cache-Control: no-store
        and X-Content-Type-Options: nosniff.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 'Private image; Cache-Control: no-store. No permanent public
            URL.'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete your photo without removing XP
      x-implementation-status: implemented
      description: Only the owner can delete; repeat deletion is idempotent. Commit
        a tombstone and deletion job before removing the object. 204 means deletion
        completed. If storage fails, return 503, prevent reads immediately and retry
        in the background. Visits, XP and reward uniqueness remain unchanged.
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Image removed or already deleted; photo metadata tombstone and
            XP remain.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/places/{id}/visits:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    post:
      summary: Confirm a visit with a ready photo and fresh location
      x-implementation-status: planned
      description: Contract only; scheduled for 25 October. Not registered in the current
        server. Owner comes from the session. Same owner/key and normalized payload
        replay the stored outcome, including a rejection. Changed payload with the same
        key returns 409. First confirmed place gives 100 XP; later visits give 0. Visit
        and award commit atomically.
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmVisitRequest'
            example:
              photo_id: 00000000-0000-4000-8000-000000000001
              location:
                lat: 53.9032997
                lon: 27.5561469
                accuracy_m: 10
                observed_at: '2026-10-25T09:00:55Z'
      responses:
        '201':
          description: New confirmed visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResult'
              example:
                visit:
                  id: 1
                  place_id: 7
                  photo_id: 00000000-0000-4000-8000-000000000001
                  status: confirmed
                  created_at: '2026-10-25T09:01:00Z'
                  confirmed_at: '2026-10-25T09:01:00Z'
                xp_awarded: 100
        '200':
          description: Replay of a confirmed outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResult'
              example:
                visit:
                  id: 1
                  place_id: 7
                  photo_id: 00000000-0000-4000-8000-000000000001
                  status: confirmed
                  created_at: '2026-10-25T09:01:00Z'
                  confirmed_at: '2026-10-25T09:01:00Z'
                xp_awarded: 100
        '422':
          description: Stored rejection; no XP. Retry with a new key and a fresh fix
            after correcting the issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedVisitResult'
              example:
                visit:
                  id: 1
                  place_id: 7
                  photo_id: 00000000-0000-4000-8000-000000000001
                  status: rejected
                  created_at: '2026-10-25T09:01:00Z'
                  rejection_code: too_far
                xp_awarded: 0
                error:
                  code: too_far
                  message: Подойдите ближе к месту
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/users/me/visits/{visit_id}:
    parameters:
    - name: visit_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    delete:
      summary: Hide your visit from history and delete its photo, retaining XP
      x-implementation-status: planned
      description: Contract only; scheduled for privacy stage before MVP release. Not
        registered in the current server.
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Hidden, or already hidden. Reward and idempotency tombstones
            remain; a later visit cannot earn the first-place reward again.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/auth/register:
    post:
      summary: Register and create a session
      x-implementation-status: implemented
      description: Requests are limited per peer IP (10/minute) and normalized email
        (5/minute), shared between register/login. Two concurrent credential operations
        per process. Forwarded IP headers are ignored. Email is not verified in this
        MVP stage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            example:
              email: walker@example.com
              password: example password 123
      responses:
        '201':
          description: Account and access session
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example: &authid001
                user: &authid002
                  id: 1
                  email: walker@example.com
                  created_at: '2026-10-21T09:00:00Z'
                access_token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                token_type: Bearer
                expires_at: '2026-10-22T09:00:00Z'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      summary: Sign in and create a session
      x-implementation-status: implemented
      description: Requests are limited per peer IP (10/minute) and normalized email
        (5/minute), shared between register/login. Two concurrent credential operations
        per process. Forwarded IP headers are ignored. Email is not verified in this
        MVP stage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            example:
              email: walker@example.com
              password: example password 123
      responses:
        '200':
          description: Access session
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example: *authid001
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      summary: Read the authenticated user
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      description: Rejects missing, malformed, unknown, expired or revoked sessions.
        Returns only the session owner. Does not accept tokens in query parameters or
        cookies.
      responses:
        '200':
          description: Current user
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
              example:
                user: *authid002
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /catalog-media/{filename}:
    parameters:
    - name: filename
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+\.(jpg|png)$'
    get:
      summary: Licensed public catalog cover
      description: Only files validated by the external demo manifest are available. No user photos or arbitrary DATA_DIR files are served.
      x-implementation-status: implemented
      responses:
        '200':
          description: Image with attribution supplied in Place.content.cover
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Cached cover is current
        '404':
          description: Unknown cover
    head:
      summary: Licensed public catalog cover headers
      description: Only files validated by the external demo manifest are available. No user photos or arbitrary DATA_DIR files are served.
      x-implementation-status: implemented
      responses:
        '200':
          description: Image headers (no body)
        '304':
          description: Cached cover is current
        '404':
          description: Unknown cover
  /health:
    get:
      operationId: health
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: API и PostgreSQL доступны
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
        '503':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: PostgreSQL недоступен
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
              example:
                status: unavailable
      x-implementation-status: implemented
      tags:
      - Catalog
  /v1/cities:
    get:
      operationId: listCities
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Города
          content:
            application/json:
              schema:
                type: object
                required:
                - cities
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
        '500':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      tags:
      - Catalog
  /v1/cities/{slug}/categories:
    parameters:
    - $ref: '#/components/parameters/CitySlug'
    get:
      operationId: listCategories
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Категории и число активных мест в городе
          content:
            application/json:
              schema:
                type: object
                required:
                - categories
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required:
                      - slug
                      - name
                      - places_count
                      properties:
                        slug:
                          type: string
                        name:
                          type: string
                        places_count:
                          type: integer
                          minimum: 0
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      tags:
      - Catalog
  /v1/cities/{slug}/places:
    parameters:
    - $ref: '#/components/parameters/CitySlug'
    get:
      operationId: listPlaces
      parameters:
      - name: category
        in: query
        schema:
          type: string
          maxLength: 100
      - name: q
        in: query
        description: Подстрока имени или описания без учёта регистра
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Активные места с полными карточками, по важности и slug
          content:
            application/json:
              schema:
                type: object
                required:
                - places
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      tags:
      - Catalog
  /v1/places/{id}:
    get:
      operationId: getPlace
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Полная карточка активного места
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      tags:
      - Catalog
  /v1/routes/generate:
    post:
      tags:
      - Routes
      operationId: generateRoutes
      summary: Генерация маршрутов
      description: Получить до трёх различных маршрутов. Все окончательные варианты пересчитаны по Directions;
        невыполнимые отбрасываются. Неизвестная цена не равна бесплатному билету. Тело — один JSON-объект
        UTF-8, не более 64 КиБ, Content-Type application/json. Повторные ключи и неизвестные поля отклоняются
        с 400.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRouteRequest'
            examples:
              normal:
                value: &id002
                  city: minsk
                  start: &id001
                    lat: 53.903333
                    lon: 27.556111
                  start_at: '2026-10-24T11:00:00+03:00'
                  budget_minutes: 120
                  pace: normal
                  categories: []
                  ticket_budget_minor: 0
                  seed: 42
                  include_geometry: false
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRouteResponse'
              examples:
                normal:
                  value:
                    seed: 42
                    timezone: Europe/Minsk
                    variants:
                    - variant_id: variant-1
                      profile: best_match
                      labels: &id003 []
                      stops:
                      - place_id: 1
                        name: Ратуша (условный ID для примера)
                        location: *id001
                        arrival: '2026-10-24T11:01:00+03:00'
                        departure: '2026-10-24T11:11:00+03:00'
                        visit_seconds: 600
                        incoming_leg:
                          walk_seconds: 60
                          distance_m: 60
                        hours_unconfirmed: true
                        price_unconfirmed: false
                      totals:
                        walk_seconds: 60
                        visit_seconds: 600
                        total_seconds: 660
                        distance_m: 60
                        cost_minor: 0
                        currency: BYN
                        cost_complete: true
                        stops_count: 1
                        unverified_stops_count: 1
                      explanation:
                        text: Один внешний осмотр; часы не подтверждены.
                        hours_unconfirmed_count: 1
                        prices_unconfirmed_count: 0
                        category_counts:
                          architecture: 1
                      geometry: null
                empty:
                  value:
                    seed: 42
                    timezone: Europe/Minsk
                    variants: []
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ConstraintsViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
  /v1/routes/recalculate:
    post:
      tags:
      - Routes
      operationId: recalculateRoute
      summary: Пересчёт маршрута
      description: 'remove: место обязано присутствовать в base_place_ids, исключается из кандидатов,
        освободившееся время может заполняться. add: место должно отсутствовать в base_place_ids и обязательно
        войти в результат. Если обязательное добавление не укладывается в ограничения — 422; скрытого
        увеличения бюджета нет. Неактивные/неизвестные ID — 404. Сначала исходный порядок проверяется
        на свежих данных; невыполнимый исходный порядок — 422.'
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculateRouteRequest'
            examples:
              normal:
                value:
                  request: *id002
                  base_place_ids:
                  - 1
                  change:
                    type: remove
                    place_id: 1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculateRouteResponse'
              examples:
                normal:
                  value:
                    seed: 42
                    timezone: Europe/Minsk
                    variant:
                      variant_id: variant-1
                      profile: best_match
                      labels: *id003
                      stops: []
                      totals:
                        walk_seconds: 0
                        visit_seconds: 0
                        total_seconds: 0
                        distance_m: 0
                        cost_minor: 0
                        currency: BYN
                        cost_complete: true
                        stops_count: 0
                        unverified_stops_count: 0
                      explanation:
                        text: Подходящих мест после исключения нет.
                        hours_unconfirmed_count: 0
                        prices_unconfirmed_count: 0
                        category_counts: {}
                      geometry: null
                    diff:
                      total_seconds_delta: -660
                      distance_m_delta: -60
                      cost_minor_delta: 0
                      added_place_ids: []
                      removed_place_ids:
                      - 1
                      prices_confirmed: true
                      text: Удалено одно место; маршрут пуст.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ConstraintsViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token issued by register/login, valid for 24 hours by default (AUTH_ACCESS_TTL).
  headers:
    RequestID:
      description: Идентификатор, назначенный сервером для поиска запроса в журнале.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  parameters:
    CitySlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  responses:
    RateLimited:
      description: Превышена частота запросов или число одновременно выполняемых расчётов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Число секунд до следующей попытки; не гарантирует наличие свободного слота.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            error:
              code: rate_limited
              message: Слишком много запросов маршрутизации; повторите позже
    Error:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Ошибка запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    ConstraintsViolation:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Обязательное добавление или исходный порядок несовместимы с временем, расписанием,
        достижимостью или бюджетом.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            error:
              code: constraints_violation
              message: Обязательное добавление или исходный порядок несовместимы с временем, расписанием,
                достижимостью или бюджетом.
    RoutingUnavailable:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Mapbox недоступен, превышена квота, отсутствует/отклонён серверный токен или истёк
        срок запроса. Токен и внутренние URL не возвращаются клиенту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            error:
              code: routing_unavailable
              message: Mapbox недоступен, превышена квота, отсутствует/отклонён серверный токен или истёк
                срок запроса. Токен и внутренние URL не возвращаются клиенту.
  schemas:
    Visit:
      type: object
      additionalProperties: false
      required:
      - id
      - place_id
      - photo_id
      - status
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        place_id:
          type: integer
          format: int64
          minimum: 1
        photo_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - confirmed
          - rejected
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
        rejection_code:
          type: string
          enum:
          - too_far
          - poor_accuracy
          - stale_location
          - future_location
          - inactive_place
          - photo_not_ready
      oneOf:
      - required:
        - confirmed_at
        properties:
          status:
            enum:
            - confirmed
        not:
          required:
          - rejection_code
      - required:
        - rejection_code
        properties:
          status:
            enum:
            - rejected
        not:
          required:
          - confirmed_at
    VisitPhoto:
      type: object
      additionalProperties: false
      required:
      - id
      - place_id
      - status
      - mime_type
      - size_bytes
      - width
      - height
      - created_at
      - ready_at
      properties:
        id:
          type: string
          format: uuid
        place_id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - ready
        mime_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        width:
          type: integer
          format: int64
          minimum: 1
        height:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
    VisitLocation:
      type: object
      additionalProperties: false
      required:
      - lat
      - lon
      - accuracy_m
      - observed_at
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
        observed_at:
          type: string
          format: date-time
    ConfirmVisitRequest:
      type: object
      additionalProperties: false
      required:
      - photo_id
      - location
      properties:
        photo_id:
          type: string
          format: uuid
        location:
          $ref: '#/components/schemas/VisitLocation'
    VisitResult:
      type: object
      additionalProperties: false
      required:
      - visit
      - xp_awarded
      properties:
        visit:
          allOf:
          - $ref: '#/components/schemas/Visit'
          - properties:
              status:
                enum:
                - confirmed
        xp_awarded:
          type: integer
          enum:
          - 0
          - 100
    RejectedVisitResult:
      type: object
      additionalProperties: false
      required:
      - visit
      - xp_awarded
      - error
      properties:
        visit:
          allOf:
          - $ref: '#/components/schemas/Visit'
          - properties:
              status:
                enum:
                - rejected
        xp_awarded:
          type: integer
          enum:
          - 0
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - too_far
              - poor_accuracy
              - stale_location
              - future_location
              - inactive_place
              - photo_not_ready
            message:
              type: string
    AuthUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 254
        created_at:
          type: string
          format: date-time
    AuthCredentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII email; trimmed and case-insensitive. No provider-specific
            rewriting.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Unicode characters; preserved exactly, without trimming. At most
            512 UTF-8 bytes.
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - user
      - access_token
      - token_type
      - expires_at
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Opaque bearer token. Store securely; never place in URLs or logs.
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          type: string
          format: date-time
          description: Access session expires after 24 hours by default (AUTH_ACCESS_TTL). Refresh is implemented
            in the next stage.
    City:
      type: object
      required:
      - id
      - slug
      - name
      - center_lat
      - center_lon
      - timezone
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        center_lat:
          type: number
          format: double
        center_lon:
          type: number
          format: double
        timezone:
          type: string
    CatalogCover:
      type: object
      required: [url, author, license, license_url, source_url, changes]
      properties:
        url:
          type: string
          description: Relative URL on the API origin, including a checksum version query.
        author:
          type: string
        license:
          type: string
        license_url:
          type: string
          format: uri
        source_url:
          type: string
          format: uri
        changes:
          type: string
    CuratedContent:
      type: object
      required: [order, story, approach, sources, reviewed_on, field_verified, cover]
      properties:
        order:
          type: integer
          minimum: 1
          maximum: 10
        story:
          type: string
        approach:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        reviewed_on:
          type: string
          format: date
        field_verified:
          type: boolean
          description: False until an on-site review has been completed.
        cover:
          $ref: '#/components/schemas/CatalogCover'
    Place:
      type: object
      required:
      - id
      - slug
      - city
      - name
      - summary
      - lat
      - lon
      - importance
      - must_see
      - visit_minutes
      - hours_known
      - price_known
      - verified_at
      - categories
      - opening_hours
      - opening_exceptions
      - prices
      - links
      - updated_at
      properties:
        content:
          $ref: '#/components/schemas/CuratedContent'
        id:
          type: integer
          format: int64
        slug:
          type: string
        city:
          type: string
        name:
          type: string
        summary:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        importance:
          type: integer
          minimum: 1
          maximum: 5
        must_see:
          type: boolean
        visit_minutes:
          type: integer
          minimum: 1
        hours_known:
          type: boolean
        price_known:
          type: boolean
        verified_at:
          type: string
          format: date
        updated_at:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: string
        opening_hours:
          type: array
          items:
            type: object
            required:
            - weekday
            - open_time
            - close_time
            properties:
              weekday:
                type: integer
                minimum: 0
                maximum: 6
                description: 0 — воскресенье
              open_time:
                type: string
                example: '11:00'
              close_time:
                type: string
                example: '24:00'
        opening_exceptions:
          type: array
          items:
            type: object
            required:
            - date
            - closed
            - open_time
            - close_time
            - note
            properties:
              date:
                type: string
                format: date
              closed:
                type: boolean
              open_time:
                type: string
                nullable: true
              close_time:
                type: string
                nullable: true
              note:
                type: string
        prices:
          type: array
          items:
            type: object
            required:
            - kind
            - amount
            - currency
            properties:
              kind:
                type: string
                enum:
                - adult
                - discount
                - free
              amount:
                type: number
                minimum: 0
              currency:
                type: string
                enum:
                - BYN
        links:
          type: array
          items:
            type: object
            required:
            - kind
            - url
            - title
            properties:
              kind:
                type: string
                enum:
                - official
                - article
                - encyclopedia
              url:
                type: string
                format: uri
              title:
                type: string
    CategorySlug:
      type: string
      enum:
      - museums
      - parks
      - architecture
      - religious
      - monuments
      - streets
    PlaceID:
      type: integer
      format: int64
      minimum: 1
    Coordinates:
      type: object
      additionalProperties: false
      required:
      - lat
      - lon
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
      description: Широта и долгота WGS84. Сервер проверяет принадлежность поддерживаемой области города.
    GenerateRouteRequest:
      type: object
      additionalProperties: false
      required:
      - start
      - start_at
      - budget_minutes
      properties:
        city:
          type: string
          default: minsk
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        start:
          $ref: '#/components/schemas/Coordinates'
        start_at:
          type: string
          format: date-time
          description: RFC3339 с UTC offset; сервер переводит в IANA timezone города (Europe/Minsk). Обязательно,
            без подстановки текущего времени.
        budget_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Общий лимит ходьбы и осмотра; возврат к старту не входит.
        pace:
          type: string
          enum:
          - slow
          - normal
          - fast
          default: normal
        categories:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            $ref: '#/components/schemas/CategorySlug'
          default: []
          description: Пустой или отсутствующий список означает все категории.
        ticket_budget_minor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Целые копейки BYN. Отсутствие/null — без лимита; 0 — нулевой лимит. Ограничивается
            сумма известных билетов; неизвестные цены отмечаются отдельно.
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          default: 42
          description: Безопасное для JavaScript целое. Один seed воспроизводим на том же каталоге, матрице
            и настройках; новые ответы Mapbox могут изменить результат.
        include_geometry:
          type: boolean
          default: true
          description: Управляет выдачей геометрии; проверка времени и расстояния через Directions обязательна
            в обоих случаях.
    RouteLeg:
      type: object
      additionalProperties: false
      required:
      - walk_seconds
      - distance_m
      properties:
        walk_seconds:
          type: number
          format: double
          minimum: 0
          description: Длительность перехода с учётом темпа; дробная часть не отбрасывается.
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Расстояние перехода в метрах.
    RouteStop:
      type: object
      additionalProperties: false
      required:
      - place_id
      - name
      - location
      - arrival
      - departure
      - visit_seconds
      - incoming_leg
      - hours_unconfirmed
      - price_unconfirmed
      properties:
        place_id:
          $ref: '#/components/schemas/PlaceID'
        name:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        arrival:
          type: string
          format: date-time
        departure:
          type: string
          format: date-time
        visit_seconds:
          type: integer
          minimum: 1
        incoming_leg:
          $ref: '#/components/schemas/RouteLeg'
        hours_unconfirmed:
          type: boolean
        price_unconfirmed:
          type: boolean
      description: Остановка в порядке посещения. Первый incoming_leg идёт от старта, остальные — от предыдущей
        остановки. departure = arrival + visit_seconds. ID внутри маршрута уникальны.
    RouteTotals:
      type: object
      additionalProperties: false
      required:
      - walk_seconds
      - visit_seconds
      - total_seconds
      - distance_m
      - cost_minor
      - currency
      - cost_complete
      - stops_count
      - unverified_stops_count
      properties:
        walk_seconds:
          type: number
          format: double
          minimum: 0
        visit_seconds:
          type: integer
          minimum: 0
        total_seconds:
          type: number
          format: double
          minimum: 0
          description: Сумма ходьбы и осмотра, без округления и возврата к старту.
        distance_m:
          type: number
          format: double
          minimum: 0
        cost_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum:
          - BYN
        cost_complete:
          type: boolean
          description: true только если цена каждой остановки известна; иначе cost_minor — подтверждённая
            часть стоимости.
        stops_count:
          type: integer
          minimum: 0
        unverified_stops_count:
          type: integer
          minimum: 0
          description: Остановка с неизвестными часами и/или ценой учитывается один раз.
    RouteExplanation:
      type: object
      additionalProperties: false
      required:
      - text
      - hours_unconfirmed_count
      - prices_unconfirmed_count
      - category_counts
      properties:
        text:
          type: string
          description: Текст для человека; округление в нём не заменяет точные totals.
        hours_unconfirmed_count:
          type: integer
          minimum: 0
        prices_unconfirmed_count:
          type: integer
          minimum: 0
        category_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Категории могут пересекаться; сумма не обязана равняться числу остановок.
    RouteGeometry:
      type: object
      additionalProperties: false
      required: &id004
      - format
      - segments
      properties: &id005
        format:
          type: string
          enum:
          - polyline6
        segments:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Упорядоченные части Directions. Соседние части могут иметь общий граничный пункт;
            возврата к старту нет.
    RouteVariant:
      type: object
      additionalProperties: false
      required:
      - variant_id
      - profile
      - labels
      - stops
      - totals
      - explanation
      - geometry
      properties:
        variant_id:
          type: string
          minLength: 1
          description: Идентификатор только в рамках данного ответа; маршрут не сохраняется сервером.
        profile:
          type: string
          enum:
          - best_match
          - more_places
          - less_walking
          - budget
        labels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - Лучший по интересам
            - Больше мест
            - Меньше ходьбы
            - Самый бюджетный
          description: Сравнение только окончательных вариантов; преимущество минимум 10%. У единственного
            варианта меток нет. Бюджетная метка требует известных цен.
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
        totals:
          $ref: '#/components/schemas/RouteTotals'
        explanation:
          $ref: '#/components/schemas/RouteExplanation'
        geometry:
          type: object
          additionalProperties: false
          required: *id004
          properties: *id005
          nullable: true
          description: null при include_geometry=false или пустом маршруте.
      description: Открытый пешеходный маршрут, заканчивается у последнего места. Полные посещения известных
        расписаний должны укладываться в интервалы с учётом исключений и timezone. Неизвестные сведения
        отмечаются явно.
    GenerateRouteResponse:
      type: object
      additionalProperties: false
      required:
      - seed
      - timezone
      - variants
      properties:
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        timezone:
          type: string
          example: Europe/Minsk
        variants:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/GeneratedRouteVariant'
          description: Непустые различные варианты после проверки Directions. [] — подходящего маршрута
            нет; это успешный ответ, а не ошибка.
    RouteChange:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - place_id
        properties:
          type:
            type: string
            enum:
            - remove
          place_id:
            $ref: '#/components/schemas/PlaceID'
      - type: object
        additionalProperties: false
        required:
        - type
        - place_id
        properties:
          type:
            type: string
            enum:
            - add
          place_id:
            $ref: '#/components/schemas/PlaceID'
      description: Одна операция. pin отложен и не входит в контракт.
    RecalculateRouteRequest:
      type: object
      additionalProperties: false
      required:
      - request
      - base_place_ids
      - change
      properties:
        request:
          $ref: '#/components/schemas/GenerateRouteRequest'
        base_place_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlaceID'
          minItems: 1
          description: 'Порядок исходного маршрута. Только ID: сервер заново получает места, расписания
            и переходы; клиентские totals не принимаются.'
        change:
          $ref: '#/components/schemas/RouteChange'
    RouteDiff:
      type: object
      additionalProperties: false
      required:
      - total_seconds_delta
      - distance_m_delta
      - cost_minor_delta
      - added_place_ids
      - removed_place_ids
      - prices_confirmed
      - text
      properties:
        total_seconds_delta:
          type: number
          format: double
        distance_m_delta:
          type: number
          format: double
        cost_minor_delta:
          type: integer
          format: int64
        added_place_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlaceID'
        removed_place_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlaceID'
        prices_confirmed:
          type: boolean
          description: true только если цены всех остановок до и после известны.
        text:
          type: string
      description: 'Знаковые изменения: результат минус исходный маршрут, пересчитанный на тех же свежих
        данных. Added — в порядке нового маршрута, removed — в порядке исходного. Только перестановка
        не означает добавление/удаление.'
    RecalculateRouteResponse:
      type: object
      additionalProperties: false
      required:
      - seed
      - timezone
      - variant
      - diff
      properties:
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        timezone:
          type: string
        variant:
          $ref: '#/components/schemas/RouteVariant'
        diff:
          $ref: '#/components/schemas/RouteDiff'
    APIError:
      description: 'Единый формат ошибки. Сообщение безопасно для клиента; внутренние SQL,
        ошибки провайдера и токены не раскрываются. Отсутствующие объекты — not_found;
        невыполнимый пересчёт — constraints_violation. Сбой маршрутизации и отмена/таймаут
        route-запроса — routing_unavailable. Для каталога внутренние сбои — internal.
        Отсутствие подходящих вариантов генерации возвращает 200 с variants: [].'
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - too_far
              - poor_accuracy
              - stale_location
              - future_location
              - inactive_place
              - photo_not_ready
              - idempotency_conflict
              - photo_already_used
              - media_unavailable
              - email_exists
              - invalid_credentials
              - unauthorized
              - unsupported_media_type
              - request_too_large
              - auth_busy
              - invalid_request
              - not_found
              - internal
              - constraints_violation
              - routing_unavailable
              - rate_limited
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Необязательные пояснения; клиент не должен полагаться на конкретные поля.
    GeneratedRouteVariant:
      allOf:
      - $ref: '#/components/schemas/RouteVariant'
      - type: object
        properties:
          stops:
            type: array
            minItems: 1
