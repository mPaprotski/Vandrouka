  /v1/routes/generate:
    post:
      tags:
      - Routes
      operationId: generateRoutes
      summary: Генерация маршрутов
      description: Получить до трёх различных маршрутов. Все окончательные варианты
        пересчитаны по Directions; невыполнимые отбрасываются. Неизвестная цена не
        равна бесплатному билету. Тело — один JSON-объект UTF-8, не более 64 КиБ,
        Content-Type application/json. Повторные ключи и неизвестные поля отклоняются
        с 400.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRouteRequest'
            examples:
              normal:
                value: &id004
                  city: minsk
                  start: &id003
                    lat: 53.903333
                    lon: 27.556111
                  start_at: '2026-10-24T11:00:00+03:00'
                  budget_minutes: 120
                  pace: normal
                  categories: []
                  ticket_budget_minor: 0
                  seed: 42
                  include_geometry: false
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRouteResponse'
              examples:
                normal:
                  value:
                    seed: 42
                    timezone: Europe/Minsk
                    variants:
                    - variant_id: variant-1
                      profile: best_match
                      labels: &id005 []
                      stops:
                      - place_id: 1
                        name: Ратуша (условный ID для примера)
                        location: *id003
                        arrival: '2026-10-24T11:01:00+03:00'
                        departure: '2026-10-24T11:11:00+03:00'
                        visit_seconds: 600
                        incoming_leg:
                          walk_seconds: 60
                          distance_m: 60
                        hours_unconfirmed: true
                        price_unconfirmed: false
                      totals:
                        walk_seconds: 60
                        visit_seconds: 600
                        total_seconds: 660
                        distance_m: 60
                        cost_minor: 0
                        currency: BYN
                        cost_complete: true
                        stops_count: 1
                        unverified_stops_count: 1
                      explanation:
                        text: Один внешний осмотр; часы не подтверждены.
                        hours_unconfirmed_count: 1
                        prices_unconfirmed_count: 0
                        category_counts:
                          architecture: 1
                      geometry: null
                empty:
                  value:
                    seed: 42
                    timezone: Europe/Minsk
                    variants: []
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ConstraintsViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
  /v1/routes/recalculate:
    post:
      tags:
      - Routes
      operationId: recalculateRoute
      summary: Пересчёт маршрута
      description: 'remove: место обязано присутствовать в base_place_ids, исключается
        из кандидатов, освободившееся время может заполняться. add: место должно отсутствовать
        в base_place_ids и обязательно войти в результат. Если обязательное добавление
        не укладывается в ограничения — 422; скрытого увеличения бюджета нет. Неактивные/неизвестные
        ID — 404. Сначала исходный порядок проверяется на свежих данных; невыполнимый
        исходный порядок — 422.'
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculateRouteRequest'
            examples:
              normal:
                value:
                  request: *id004
                  base_place_ids:
                  - 1
                  change:
                    type: remove
                    place_id: 1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculateRouteResponse'
              examples:
                normal:
                  value:
                    seed: 42
                    timezone: Europe/Minsk
                    variant:
                      variant_id: variant-1
                      profile: best_match
                      labels: *id005
                      stops: []
                      totals:
                        walk_seconds: 0
                        visit_seconds: 0
                        total_seconds: 0
                        distance_m: 0
                        cost_minor: 0
                        currency: BYN
                        cost_complete: true
                        stops_count: 0
                        unverified_stops_count: 0
                      explanation:
                        text: Подходящих мест после исключения нет.
                        hours_unconfirmed_count: 0
                        prices_unconfirmed_count: 0
                        category_counts: {}
                      geometry: null
                    diff:
                      total_seconds_delta: -660
                      distance_m_delta: -60
                      cost_minor_delta: 0
                      added_place_ids: []
                      removed_place_ids:
                      - 1
                      prices_confirmed: true
                      text: Удалено одно место; маршрут пуст.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ConstraintsViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
  /v1/users/me/visits:
    get:
      summary: Your confirmed visits, newest first
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      description: Private no-store history. Sort by created_at DESC, id DESC; opaque
        keyset cursor. Hidden and rejected visits excluded; deleted photos yield null.
        XP remains in ledger. Cursor is not an owner selector.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: Page of confirmed visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                visits: []
                next_cursor: null
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/users/me/visits/{id}:
    delete:
      summary: Hide your confirmed visit and delete its photo, retaining XP and replay
        protection
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '204':
          description: Hidden, including repeated requests
        '400':
