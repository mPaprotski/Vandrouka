            message:
              type: string
    AuthUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 254
        created_at:
          type: string
          format: date-time
    AuthCredentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII email; trimmed and case-insensitive. No provider-specific
            rewriting.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Unicode characters; preserved exactly, without trimming. At
            most 512 UTF-8 bytes.
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - user
      - access_token
      - token_type
      - expires_at
      - refresh_token
      - refresh_expires_at
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Opaque bearer token. Store securely; never place in URLs or
            logs.
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          type: string
          format: date-time
          description: Access expires after 24 hours by default, capped by the refresh-family
            deadline. Refresh revokes the previous access token.
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Single-use opaque refresh credential. Store only in encrypted
            storage; never put in URLs/logs.
        refresh_expires_at:
          type: string
          format: date-time
          description: Absolute family deadline, 30 days by default (AUTH_REFRESH_TTL).
            Rotation does not extend it.
    RefreshCredential:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    City:
      type: object
      required:
      - id
      - slug
      - name
      - center_lat
      - center_lon
      - timezone
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        center_lat:
          type: number
          format: double
        center_lon:
          type: number
          format: double
        timezone:
          type: string
    CatalogCover:
      type: object
      required:
      - url
      - author
      - license
      - license_url
      - source_url
      - changes
      properties:
        url:
