openapi: 3.0.3
info:
  title: Вандроўка API
  version: 0.8.0
  description: Каталог, маршруты generate/recalculate, серверная авторизация, приватные
    фото и подтверждение посещений с XP «Вандроўкі». Register/login выдают access/refresh;
    refresh выполняет ротацию, logout отзывает цепочку, me возвращает владельца сессии.
    Часы и цены неизвестных мест не считаются подтверждёнными.
servers:
- url: http://localhost:8080
paths:
  "/v1/quest-participations/{id}/attempts":
    post:
      summary: Открыть попытку текущего задания
      description: Повтор возвращает уже открытый черновик или отправленную попытку
        текущего задания.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestAttempt"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_id
              properties:
                task_id:
                  type: string
                  format: uuid
  "/v1/quest-attempts/{id}":
    get:
      summary: Получить свою попытку
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestAttempt"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quest-attempts/{id}/photo":
    put:
      summary: Загрузить и обработать фото
      description: Одно поле file с JPEG или PNG, до 10 МиБ и 4 Мп. Сервер берёт место
        из задания и сохраняет только прошедшее обработку фото. Повтор той же загрузки
        возвращает готовый снимок.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestAttempt"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/Error"
        '503':
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
    get:
      summary: Получить обработанный снимок
      description: Приватное фото доступно участнику и организатору его запуска после
        отправки на проверку.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/Error"
        '503':
          "$ref": "#/components/responses/Error"
  "/v1/quest-attempts/{id}/submit":
    post:
      summary: Проверить GPS и отправить работу
      description: Повтор успешного запроса с тем же ключом и координатами возвращает
        состояние попытки без новой проверки GPS.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestAttempt"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          description: 'Снимок остаётся в черновике. Ошибки GPS: too_far, poor_accuracy,
            stale_location, future_location или invalid_quest.'
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/APIError"
                - "$ref": "#/components/schemas/PhotoQuestValidationError"
        '500':
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - location
              properties:
                location:
                  type: object
                  required:
                  - lat
                  - lon
                  - accuracy_m
                  - observed_at
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lon:
                      type: number
                      minimum: -180
                      maximum: 180
                    accuracy_m:
                      type: number
                      minimum: 0
                    observed_at:
                      type: string
                      format: date-time
  "/v1/quest-attempts/{id}/withdraw":
    post:
      summary: Отозвать черновик или работу на проверке
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestAttempt"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quest-runs/{run_id}/reviews":
    get:
      summary: Очередь снимков для организатора
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PhotoQuestReviewItem"
                    maxItems: 30
                  next_cursor:
                    type: string
                    format: uuid
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quest-attempts/{id}/review":
    post:
      summary: Принять или отклонить работу
      description: При отклонении нужен комментарий. При принятии посещение, XP и переход
        к следующему заданию фиксируются вместе.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestAttempt"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          description: Некорректное поле квеста
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestValidationError"
        '500':
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_revision
              - decision
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                decision:
                  type: string
                  enum:
                  - accept
                  - reject
                reason:
                  type: string
                  maxLength: 1000
  "/v1/quests":
    post:
      summary: Создать черновик
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city_id:
                  type: integer
                  format: int64
                  minimum: 1
              required:
              - city_id
      responses:
        '201':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestEditor"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          description: Укажите корректные данные
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestValidationError"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quests/mine":
    get:
      summary: Список моих маршрутов
      security:
      - BearerAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PhotoQuest"
                    maxItems: 30
                  next_cursor:
                    type: string
                    format: uuid
                required:
                - items
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quests/{quest_id}/editor":
    get:
      summary: Открыть редактор
      security:
      - BearerAuth: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestEditor"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quests/{quest_id}":
    put:
      summary: Сохранить черновик
      description: Заменяет весь список заданий. Порядок берётся из массива. Сохранение
        опубликованного шаблона создаёт черновик новой редакции.
      security:
      - BearerAuth: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 3000
                steps:
                  type: array
                  items:
                    "$ref": "#/components/schemas/PhotoQuestStep"
                  maxItems: 20
              required:
              - expected_revision
              - steps
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestEditor"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          description: Укажите корректные данные
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestValidationError"
        '500':
          "$ref": "#/components/responses/Error"
    delete:
      summary: Удалить черновик без запусков
      security:
      - BearerAuth: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expected_revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '204':
          description: Черновик удалён
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quests/{quest_id}/publish":
    post:
      summary: Опубликовать редакцию
      description: Нужны от 2 до 20 разных действующих мест одного города, название
        от 3 символов и три непустых текста на каждое задание.
      security:
      - BearerAuth: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
              required:
              - expected_revision
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuest"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          description: Укажите корректные данные
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestValidationError"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quests/{quest_id}/archive":
    post:
      summary: Архивировать шаблон
      security:
      - BearerAuth: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
              required:
              - expected_revision
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuest"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quests/{quest_id}/runs":
    post:
      summary: Создать запуск из опубликованной редакции
      description: Сохраняет копию заданий и показывает код приглашения. Последующие
        правки шаблона на запуск не влияют.
      security:
      - BearerAuth: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
                title:
                  type: string
                  maxLength: 120
                  minLength: 3
              required:
              - expected_revision
              - title
      responses:
        '201':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestInvite"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '415':
          "$ref": "#/components/responses/Error"
        '422':
          description: Укажите корректные данные
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestValidationError"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quest-runs/mine":
    get:
      summary: Список моих запусков
      security:
      - BearerAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PhotoQuestRun"
                    maxItems: 30
                  next_cursor:
                    type: string
                    format: uuid
                required:
                - items
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quest-runs/{run_id}/manage":
    get:
      summary: Получить свой запуск
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestRun"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  "/v1/quest-runs/{run_id}/start":
    post:
      summary: Начать запуск
      description: Повторный вызов возвращает прежнее время старта.
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestRun"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
  /v1/quest-runs/{run_id}/finish:
    post:
      summary: Завершить прогулку
      description: Закрывает вход и новые отправки. Уже отправленные снимки остаются доступны организатору для проверки.
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Прогулка завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoQuestRun'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  "/v1/quest-runs/{run_id}/join-code":
    post:
      summary: Заменить код запуска
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoQuestInvite"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
