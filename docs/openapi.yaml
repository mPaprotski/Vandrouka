                  user:
                    $ref: '#/components/schemas/AuthUser'
              example:
                user: *id002
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      summary: Permanently delete your account with current password
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
