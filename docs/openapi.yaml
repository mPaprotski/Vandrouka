  /v1/visits/photo-upload:
    post:
      summary: Upload a private visit photo
      x-implementation-status: implemented
      description: 'Authenticated multipart upload: exactly one place_id and file;
        no user_id. File up to 10 MiB, 20 million pixels and 8192 pixels per side.
        Actual JPEG/PNG must match declared MIME. Server applies EXIF orientation,
        re-encodes to remove metadata and returns only after a private object and
        ready metadata are saved. Two concurrent media operations per process, six
        upload attempts per minute per owner. Storage failures return 503 with durable
        cleanup of abandoned objects.'
