      - field_verified
      - cover
      properties:
        order:
          type: integer
          minimum: 1
          maximum: 10
        story:
          type: string
        approach:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        reviewed_on:
          type: string
          format: date
        field_verified:
          type: boolean
          description: False until an on-site review has been completed.
        cover:
          $ref: '#/components/schemas/CatalogCover'
    Place:
      type: object
      required:
      - id
      - slug
      - city
      - name
      - summary
      - lat
      - lon
      - importance
      - must_see
      - visit_minutes
      - hours_known
      - price_known
      - verified_at
      - categories
      - opening_hours
      - opening_exceptions
      - prices
      - links
      - updated_at
      properties:
        content:
          $ref: '#/components/schemas/CuratedContent'
        id:
          type: integer
          format: int64
        slug:
          type: string
        city:
          type: string
        name:
          type: string
        summary:
          type: string
        address:
          type: string
          description: Human-readable street address or named park/area. Omitted when unavailable.
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        importance:
          type: integer
          minimum: 1
          maximum: 5
        must_see:
          type: boolean
        visit_minutes:
          type: integer
          minimum: 1
        hours_known:
          type: boolean
        price_known:
          type: boolean
        verified_at:
          type: string
          format: date
        updated_at:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: string
        opening_hours:
          type: array
          items:
            type: object
            required:
            - weekday
            - open_time
            - close_time
            properties:
              weekday:
                type: integer
                minimum: 0
                maximum: 6
                description: 0 — воскресенье
              open_time:
                type: string
                example: '11:00'
              close_time:
                type: string
                example: '24:00'
        opening_exceptions:
          type: array
          items:
            type: object
            required:
            - date
            - closed
            - open_time
            - close_time
            - note
            properties:
              date:
                type: string
                format: date
              closed:
                type: boolean
              open_time:
                type: string
                nullable: true
              close_time:
                type: string
                nullable: true
              note:
                type: string
        prices:
          type: array
          items:
            type: object
            required:
            - kind
            - amount
            - currency
            properties:
              kind:
                type: string
                enum:
                - adult
                - discount
                - free
              amount:
                type: number
                minimum: 0
              currency:
                type: string
                enum:
                - BYN
        links:
          type: array
          items:
            type: object
            required:
            - kind
            - url
            - title
            properties:
              kind:
                type: string
                enum:
                - official
                - article
                - encyclopedia
              url:
                type: string
                format: uri
              title:
                type: string
    CategorySlug:
      type: string
      enum:
      - museums
      - parks
      - architecture
      - religious
      - monuments
      - streets
    PlaceID:
      type: integer
      format: int64
      minimum: 1
    Coordinates:
      type: object
      additionalProperties: false
      required:
      - lat
      - lon
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
      description: Широта и долгота WGS84. Сервер проверяет принадлежность поддерживаемой
        области города.
    GenerateRouteRequest:
      type: object
      additionalProperties: false
      required:
      - start
      - start_at
      - budget_minutes
      properties:
        travel_mode:
          type: string
          enum: [walking, cycling]
          default: walking
          description: Вид транспорта. Темп pace применяется к walking.
        max_distance_m:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000000
          description: Максимальная длина пути в метрах. Отсутствие означает отсутствие лимита.
        max_stops:
          type: integer
          minimum: 1
          maximum: 100
          description: Максимальное число мест. Отсутствие означает отсутствие лимита.
        city:
          type: string
          default: minsk
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        start:
          $ref: '#/components/schemas/Coordinates'
        start_at:
          type: string
          format: date-time
          description: RFC3339 с UTC offset; сервер переводит в IANA timezone города
            (Europe/Minsk). Обязательно, без подстановки текущего времени.
        budget_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Общий лимит ходьбы и осмотра; возврат к старту не входит.
        pace:
          type: string
          enum:
          - slow
          - normal
          - fast
          default: normal
        categories:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            $ref: '#/components/schemas/CategorySlug'
          default: []
          description: Пустой или отсутствующий список означает все категории.
        ticket_budget_minor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Целые копейки BYN. Отсутствие/null — без лимита; 0 — нулевой
            лимит. Ограничивается сумма известных билетов; неизвестные цены отмечаются
            отдельно.
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          default: 42
          description: Безопасное для JavaScript целое. Один seed воспроизводим на
            том же каталоге, матрице и настройках; новые ответы Mapbox могут изменить
            результат.
        include_geometry:
          type: boolean
          default: true
          description: Управляет выдачей геометрии; проверка времени и расстояния
            через Directions обязательна в обоих случаях.
    RouteLeg:
      type: object
      additionalProperties: false
      required:
      - walk_seconds
      - distance_m
      properties:
        walk_seconds:
          type: number
          format: double
          minimum: 0
          description: Длительность перехода с учётом темпа; дробная часть не отбрасывается.
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Расстояние перехода в метрах.
    RouteStop:
      type: object
      additionalProperties: false
      required:
      - place_id
      - name
      - location
      - arrival
      - departure
      - visit_seconds
      - incoming_leg
      - hours_unconfirmed
      - price_unconfirmed
      properties:
        place_id:
          $ref: '#/components/schemas/PlaceID'
        name:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        arrival:
          type: string
          format: date-time
        departure:
          type: string
          format: date-time
        visit_seconds:
          type: integer
          minimum: 1
        incoming_leg:
          $ref: '#/components/schemas/RouteLeg'
        hours_unconfirmed:
          type: boolean
        price_unconfirmed:
          type: boolean
      description: Остановка в порядке посещения. Первый incoming_leg идёт от старта,
        остальные — от предыдущей остановки. departure = arrival + visit_seconds.
        ID внутри маршрута уникальны.
    RouteTotals:
      type: object
      additionalProperties: false
      required:
      - walk_seconds
      - visit_seconds
      - total_seconds
      - distance_m
      - cost_minor
      - currency
      - cost_complete
      - stops_count
      - unverified_stops_count
      properties:
        walk_seconds:
          type: number
          format: double
          minimum: 0
        visit_seconds:
          type: integer
          minimum: 0
        total_seconds:
          type: number
          format: double
          minimum: 0
          description: Сумма ходьбы и осмотра, без округления и возврата к старту.
        distance_m:
          type: number
          format: double
          minimum: 0
        cost_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum:
          - BYN
        cost_complete:
          type: boolean
          description: true только если цена каждой остановки известна; иначе cost_minor
            — подтверждённая часть стоимости.
        stops_count:
          type: integer
          minimum: 0
        unverified_stops_count:
          type: integer
          minimum: 0
          description: Остановка с неизвестными часами и/или ценой учитывается один
            раз.
    RouteExplanation:
      type: object
      additionalProperties: false
      required:
      - text
      - hours_unconfirmed_count
      - prices_unconfirmed_count
      - category_counts
      properties:
        text:
          type: string
          description: Текст для человека; округление в нём не заменяет точные totals.
        hours_unconfirmed_count:
          type: integer
          minimum: 0
        prices_unconfirmed_count:
          type: integer
          minimum: 0
        category_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Категории могут пересекаться; сумма не обязана равняться числу
            остановок.
    RouteGeometry:
      type: object
      additionalProperties: false
      required: &id006
      - format
      - segments
      properties: &id007
        format:
          type: string
          enum:
          - polyline6
        segments:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Упорядоченные части Directions. Соседние части могут иметь
            общий граничный пункт; возврата к старту нет.
    RouteVariant:
      type: object
      additionalProperties: false
      required:
      - variant_id
      - profile
      - labels
      - stops
      - totals
      - explanation
      - geometry
      properties:
        variant_id:
          type: string
          minLength: 1
          description: Идентификатор только в рамках данного ответа; маршрут не сохраняется
            сервером.
        profile:
          type: string
          enum:
          - best_match
          - more_places
          - less_walking
          - budget
        labels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - Лучший по интересам
            - Больше мест
            - Меньше ходьбы
            - Самый бюджетный
          description: Сравнение только окончательных вариантов; преимущество минимум
            10%. У единственного варианта меток нет. Бюджетная метка требует известных
            цен.
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
        totals:
          $ref: '#/components/schemas/RouteTotals'
        explanation:
          $ref: '#/components/schemas/RouteExplanation'
        geometry:
          type: object
          additionalProperties: false
          required: *id006
          properties: *id007
          nullable: true
          description: null при include_geometry=false или пустом маршруте.
      description: Открытый пешеходный маршрут, заканчивается у последнего места.
        Полные посещения известных расписаний должны укладываться в интервалы с учётом
        исключений и timezone. Неизвестные сведения отмечаются явно.
    GenerateRouteResponse:
      type: object
      additionalProperties: false
      required:
      - seed
      - timezone
      - variants
      properties:
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        timezone:
          type: string
          example: Europe/Minsk
        variants:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/GeneratedRouteVariant'
          description: Непустые различные варианты после проверки Directions. [] —
            подходящего маршрута нет; это успешный ответ, а не ошибка.
    RouteChange:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - place_id
        properties:
          type:
            type: string
            enum:
            - remove
          place_id:
            $ref: '#/components/schemas/PlaceID'
      - type: object
        additionalProperties: false
        required:
        - type
        - place_id
        properties:
          type:
            type: string
            enum:
            - add
          place_id:
            $ref: '#/components/schemas/PlaceID'
      description: Одна операция. pin отложен и не входит в контракт.
    RecalculateRouteRequest:
      type: object
      additionalProperties: false
      required:
      - request
      - base_place_ids
      - change
      properties:
        request:
          $ref: '#/components/schemas/GenerateRouteRequest'
        base_place_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlaceID'
          minItems: 1
          description: 'Порядок исходного маршрута. Только ID: сервер заново получает
            места, расписания и переходы; клиентские totals не принимаются.'
        change:
          $ref: '#/components/schemas/RouteChange'
    RouteDiff:
      type: object
      additionalProperties: false
      required:
      - total_seconds_delta
      - distance_m_delta
      - cost_minor_delta
      - added_place_ids
      - removed_place_ids
      - prices_confirmed
      - text
      properties:
        total_seconds_delta:
          type: number
          format: double
        distance_m_delta:
          type: number
          format: double
        cost_minor_delta:
          type: integer
          format: int64
        added_place_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlaceID'
        removed_place_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlaceID'
        prices_confirmed:
          type: boolean
          description: true только если цены всех остановок до и после известны.
        text:
          type: string
      description: 'Знаковые изменения: результат минус исходный маршрут, пересчитанный
        на тех же свежих данных. Added — в порядке нового маршрута, removed — в порядке
        исходного. Только перестановка не означает добавление/удаление.'
    RecalculateRouteResponse:
      type: object
      additionalProperties: false
      required:
      - seed
      - timezone
      - variant
      - diff
      properties:
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        timezone:
          type: string
        variant:
          $ref: '#/components/schemas/RouteVariant'
        diff:
          $ref: '#/components/schemas/RouteDiff'
    APIError:
      description: 'Единый формат ошибки. Сообщение безопасно для клиента; внутренние
        SQL, ошибки провайдера и токены не раскрываются. Отсутствующие объекты — not_found;
        невыполнимый пересчёт — constraints_violation. Сбой маршрутизации и отмена/таймаут
        route-запроса — routing_unavailable. Для каталога внутренние сбои — internal.
        Отсутствие подходящих вариантов генерации возвращает 200 с variants: [].'
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - too_far
              - poor_accuracy
              - stale_location
              - future_location
              - inactive_place
              - photo_not_ready
              - idempotency_conflict
              - photo_already_used
              - media_unavailable
              - email_exists
              - invalid_credentials
              - unauthorized
              - unsupported_media_type
              - request_too_large
              - auth_busy
              - invalid_request
              - not_found
              - internal
              - constraints_violation
              - routing_unavailable
              - rate_limited
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Необязательные пояснения; клиент не должен полагаться на
                конкретные поля.
    GeneratedRouteVariant:
      allOf:
      - $ref: '#/components/schemas/RouteVariant'
      - type: object
        properties:
          stops:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/RouteStop'
      description: Генерация выдаёт только непустые варианты; recalculate может вернуть
        пустой маршрут.
    HistoryItem:
      type: object
      required:
      - id
      - place_id
      - place_name
      - place_active
      - timezone
      - created_at
      - confirmed_at
      - photo_id
      - xp_awarded
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        place_id:
          type: integer
          format: int64
          minimum: 1
        place_name:
          type: string
        place_active:
          type: boolean
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
        photo_id:
          type: string
          format: uuid
          nullable: true
        xp_awarded:
          type: integer
          enum:
          - 0
          - 100
    HistoryPage:
      type: object
      required:
      - visits
      - next_cursor
      properties:
        visits:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/HistoryItem'
        next_cursor:
          type: string
          nullable: true
          maxLength: 256
    DiscoveryAchievement:
      type: object
      required:
      - code
      - name
      - target
      - progress
      - earned_at
      properties:
        code: &id008
          type: string
          minLength: 1
        name: *id008
        target:
          type: integer
          minimum: 1
        progress: &id009
          type: integer
          minimum: 0
        earned_at: &id010
          type: string
          format: date-time
          nullable: true
    CollectionPlace:
      type: object
      required:
      - slug
      - name
      - place_id
      - available
      - visited
      properties:
        slug: *id008
        name: *id008
        place_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        available:
          type: boolean
        visited:
          type: boolean
    DiscoveryCollection:
      type: object
      required:
      - code
      - name
      - city
      - total
      - visited
      - completed_at
      - places
      properties:
        code: *id008
        name: *id008
        city: *id008
        total:
          type: integer
          minimum: 1
          maximum: 50
        visited: *id009
        completed_at: *id010
        places:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CollectionPlace'
    Exploration:
      type: object
      required:
      - discovered_places
      - achievements
      - collections
      properties:
        discovered_places: *id009
        achievements:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/DiscoveryAchievement'
        collections:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DiscoveryCollection'
tags:
- name: Catalog
  description: Реализованный каталог
- name: Routes
  description: Контракт для реализации на этапах 27–28 октября
