              additionalProperties: false
              required:
              - password
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: Account and sessions deleted; private objects queued for deletion
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
