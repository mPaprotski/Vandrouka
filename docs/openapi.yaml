      schema:
        type: string
        format: uuid
    get:
      summary: Read your private visit photo
      x-implementation-status: implemented
      description: 'Only the session owner can read a ready, undeleted photo. Foreign,
        missing, malformed and deleted IDs return the same 404. Object length and
        SHA-256 are checked before returning any bytes. No public URL; Cache-Control:
        no-store and X-Content-Type-Options: nosniff.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 'Private image; Cache-Control: no-store. No permanent public
            URL.'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete your photo without removing XP
      x-implementation-status: implemented
      description: Only the owner can delete; repeat deletion is idempotent. Commit
        a tombstone and deletion job before removing the object. 204 means deletion
        completed. If storage fails, return 503, prevent reads immediately and retry
        in the background. Visits, XP and reward uniqueness remain unchanged. Automatic
        draft cleanup must use unconfirmed_only=true. After acquiring the photo row
        lock, the server checks confirmed visits in a fresh statement; confirmed media
        returns 409 photo_confirmed without tombstone or storage IO.
      parameters:
      - name: unconfirmed_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Image removed or already deleted; photo metadata tombstone
            and XP remain.
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/places/{id}/visits:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    post:
      summary: Confirm a visit with a ready photo and fresh location
      x-implementation-status: implemented
      description: 'Owner comes from the session. Same owner/key and normalized payload
        replay the stored outcome, including a rejection. Changed payload with the
        same key returns 409. First confirmed place gives 100 XP; later visits give
        0. Visit and award commit atomically. GPS defaults are distance <= 50 m, accuracy
        <= 30 m, observed_at in [received_at - 120 s, received_at + 30 s], inclusive
        and without rounding. Failure precedence is inactive_place, photo_not_ready,
        poor_accuracy, stale_location, future_location, too_far. Missing/foreign/deleted
        photo is 404; a photo already used for confirmation is 409 photo_already_used.
        Resource checks precede business validation. Replay precedes resource checks
        and never reevaluates GPS. Canonical UUID case, UTC timestamps and parsed
        numbers form the request hash. Cache-Control is no-store; raw GPS and storage
        keys are never returned. Per-process limits: 30 authenticated attempts/minute/owner;
        4 concurrent confirmations globally; 429 with Retry-After. Retries keep the
        same Idempotency-Key.'
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmVisitRequest'
            example:
              photo_id: 00000000-0000-4000-8000-000000000001
              location:
                lat: 53.9032997
                lon: 27.5561469
                accuracy_m: 10
                observed_at: '2026-10-25T09:00:55Z'
      responses:
        '201':
          description: New confirmed visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResult'
              example:
                visit:
                  id: 1
                  place_id: 7
                  photo_id: 00000000-0000-4000-8000-000000000001
                  status: confirmed
                  created_at: '2026-10-25T09:01:00Z'
                  confirmed_at: '2026-10-25T09:01:00Z'
                xp_awarded: 100
        '200':
          description: Replay of a confirmed outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResult'
              example:
                visit:
                  id: 1
                  place_id: 7
                  photo_id: 00000000-0000-4000-8000-000000000001
                  status: confirmed
                  created_at: '2026-10-25T09:01:00Z'
                  confirmed_at: '2026-10-25T09:01:00Z'
                xp_awarded: 100
        '422':
          description: Stored rejection; no XP. Retry with a new key and a fresh fix
            after correcting the issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedVisitResult'
              example:
                visit:
                  id: 1
                  place_id: 7
                  photo_id: 00000000-0000-4000-8000-000000000001
                  status: rejected
                  created_at: '2026-10-25T09:01:00Z'
                  rejection_code: too_far
                xp_awarded: 0
                error:
                  code: too_far
                  message: Подойдите ближе к месту
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
